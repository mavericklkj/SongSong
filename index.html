<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1219">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Trade Journal</title>
<style>
:root{
  --bg:#0D1219; --panel:#151C26; --panel2:#1B2431; --line:#26303F; --line2:#31405433;
  --text:#EAF0F7; --mut:#8794A6; --mut2:#5D6B7E;
  --gold:#E7B563; --gold-deep:#B9884A; --gold-soft:#E7B56322;
  --win:#3DCE8E; --win-soft:#3DCE8E1f; --loss:#F26D6D; --loss-soft:#F26D6D1f;
  --open:#E7A63C; --open-soft:#E7A63C1f;
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  --shadow:0 10px 30px #0009;
  --nav-h:calc(60px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.45 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-weight:650;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--win)} .neg{color:var(--loss)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.banner{background:#5b3b12;color:#ffd9a0;text-align:center;font-size:13px;padding:8px 14px}
.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  max-width:680px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:linear-gradient(var(--bg) 80%,transparent);
}
.brand{display:flex;align-items:center;gap:9px}
.brand .logo{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:13px;color:#1a1206;
  background:linear-gradient(145deg,var(--gold),var(--gold-deep));
}
.brand h1{font-size:17px}
.tier-pill{
  border:1px solid var(--gold-deep);color:var(--gold);background:var(--gold-soft);
  border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;transition:transform .15s;
}
.tier-pill:active{transform:scale(.95)}
.view{max-width:680px;margin:0 auto;padding:4px 16px calc(var(--nav-h) + 84px)}
.tabs{
  position:fixed;inset:auto 0 0 0;z-index:30;display:flex;justify-content:center;gap:2px;
  background:#111823ee;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
.tabs button{
  flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;border-radius:10px;color:var(--mut);font-size:10.5px;font-weight:600;
  letter-spacing:.03em;position:relative;transition:color .15s;
}
.tabs button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--gold)}
.tabs button .dot{position:absolute;top:4px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--loss)}
.fab{
  position:fixed;right:max(18px,calc(50% - 322px));bottom:calc(var(--nav-h) + 16px);z-index:29;
  width:54px;height:54px;border-radius:18px;font-size:26px;line-height:1;color:#1a1206;
  background:linear-gradient(145deg,var(--gold),var(--gold-deep));box-shadow:0 8px 24px #e7b56340;
  transition:transform .15s;
}
.fab:active{transform:scale(.92)}

/* ---------- primitives ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-top:14px}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:12px;font-weight:600}
.hint{color:var(--mut);font-size:13px}
.row{display:flex;align-items:center}
.gap{gap:10px}
.spread{justify-content:space-between}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-md);
  padding:11px 16px;font-weight:600;font-size:14px;transition:transform .12s,filter .15s;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.primary{background:linear-gradient(145deg,var(--gold),var(--gold-deep));color:#1a1206;border:0}
.btn.danger{color:var(--loss);border-color:#f26d6d55}
.btn.ghost{background:transparent}
.btn.small{padding:8px 12px;font-size:13px}
.btn.block{width:100%}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mut);font-size:15px}
.icon-btn:active{background:var(--panel2)}
.field{margin-top:14px}
.field>label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:7px;font-weight:600}
.input{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-md);
  padding:11px 12px;font-size:15px;transition:border-color .15s;
}
.input:focus{outline:none;border-color:var(--gold-deep)}
textarea.input{resize:vertical;min-height:44px}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--line);background:var(--panel2);border-radius:999px;
  padding:7px 13px;font-size:13.5px;font-weight:550;color:var(--mut);transition:all .12s;
}
.chip.on{border-color:var(--gold-deep);background:var(--gold-soft);color:var(--gold)}
.chip:active{transform:scale(.95)}
.chip .x{margin-left:6px;opacity:.55;font-size:12px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-md);padding:3px;gap:3px}
.seg button{
  flex:1;min-width:0;padding:8px 2px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--mut);
  display:flex;flex-direction:column;align-items:center;line-height:1.25;transition:all .12s;
}
.seg button small{font-size:10.5px;font-weight:500;opacity:.75;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px #0006}
.seg button.on.win{color:var(--win)} .seg button.on.loss{color:var(--loss)} .seg button.on.gold{color:var(--gold)}

/* ---------- tier tab ---------- */
.hero{
  margin-top:14px;border-radius:var(--r-lg);padding:22px 18px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#1d2634,#141B25 60%);
  border:1px solid var(--gold-deep);
}
.hero::before{content:'';position:absolute;inset:-40% -20% auto;height:120%;background:radial-gradient(closest-side,#e7b56318,transparent);pointer-events:none}
.hero .eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);font-weight:600}
.hero .big{font-size:42px;font-weight:700;letter-spacing:-.02em;margin:2px 0 10px}
.hero .facts{display:flex;gap:22px}
.hero .facts div span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.hero .facts div b{font-size:18px;font-weight:650}
.ladder{display:flex;flex-direction:column;gap:8px}
.rung{
  display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;
}
.rung.cur{border-color:var(--gold-deep);background:var(--gold-soft)}
.rung .tn{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;
  background:var(--panel);border:1px solid var(--line);color:var(--mut);
}
.rung.cur .tn{background:linear-gradient(145deg,var(--gold),var(--gold-deep));color:#1a1206;border:0}
.rung .lbl span{display:block;font-size:11px;color:var(--mut)}
.rung .lbl b{font-size:15px}
.rung .tpv{text-align:right;font-size:13px;color:var(--mut)}
.rung .tpv b{display:block;font-size:15px;color:var(--win)}
.path-wrap{overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chart{width:100%;height:auto;display:block}
.calc-out{
  margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;
}
.calc-out div span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-bottom:3px}
.calc-out div b{font-size:17px;font-weight:650}
.calc-out .size b{color:var(--gold)}

/* ---------- trades tab ---------- */
.filters{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.filters .row{gap:10px}
.filters select{flex:1;padding:9px 12px;font-size:13.5px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:20px 2px 10px}
.sec-h h2{font-size:15px}
.sec-h .count{font-size:12.5px;color:var(--mut)}
.trade{
  width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-left:4px solid var(--mut2);border-radius:var(--r-md);padding:13px 14px;margin-bottom:9px;
  transition:transform .12s;display:block;
}
.trade:active{transform:scale(.985)}
.trade.win{border-left-color:var(--win)} .trade.loss{border-left-color:var(--loss)}
.trade.be{border-left-color:var(--mut)} .trade.open{border-left-color:var(--open)}
.trade .t1{display:flex;align-items:center;gap:8px}
.trade .pair{font-weight:700;font-size:15px}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2.5px 7px}
.badge.long{background:var(--win-soft);color:var(--win)} .badge.short{background:var(--loss-soft);color:var(--loss)}
.badge.tier{background:var(--gold-soft);color:var(--gold)}
.badge.open{background:var(--open-soft);color:var(--open)}
.trade .pnl{margin-left:auto;font-weight:700;font-size:15px}
.trade .t2{margin-top:5px;font-size:12.5px;color:var(--mut)}
.trade .tags{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.empty{
  margin-top:36px;text-align:center;color:var(--mut);padding:0 20px;
}
.empty .glyph{font-size:34px;margin-bottom:10px;opacity:.6}
.empty p{margin-bottom:16px;font-size:14px}

/* ---------- stats ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px}
.stat span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-bottom:4px}
.stat b{font-size:19px;font-weight:650}
.stat small{font-size:11.5px;color:var(--mut);margin-left:5px;font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600;text-align:right;padding:0 0 8px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 0;border-top:1px solid var(--line2);text-align:right}
.tbl td:first-child{font-weight:600}

/* ---------- manage / backup ---------- */
.add-row{display:flex;gap:8px;margin-top:12px}
.add-row .input{flex:1;text-transform:uppercase}
.add-row .input.nocaps{text-transform:none}
.bk-status{display:flex;align-items:center;gap:10px;font-size:14px}
.bk-status .led{width:9px;height:9px;border-radius:50%;background:var(--win);flex:none}
.bk-status.warn .led{background:var(--loss)}
.bk-status.warn{color:#ffb4b4}
.bk-desc{font-size:12.5px;color:var(--mut);margin:4px 0 10px}

/* ---------- overlays ---------- */
.overlay{
  position:fixed;inset:0;z-index:50;background:#060a10b8;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;transition:opacity .22s;
}
.overlay[hidden]{display:none!important}
.overlay:not(.show){pointer-events:none}
.overlay.show{opacity:1}
.overlay.center{display:grid;place-items:center;padding:24px}
.sheet-panel{
  position:absolute;left:50%;bottom:0;transform:translate(-50%,30px);width:100%;max-width:640px;
  max-height:calc(100dvh - 40px);display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  transition:transform .26s cubic-bezier(.32,.72,.35,1);box-shadow:var(--shadow);
}
.overlay.show .sheet-panel{transform:translate(-50%,0)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 4px}
.sheet-head h2{font-size:17px}
.sheet-body{overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-foot .btn{flex:1}
@media (min-width:700px){
  .sheet-panel{bottom:auto;top:50%;transform:translate(-50%,calc(-50% + 24px));border-radius:20px;border-bottom:1px solid var(--line);max-height:calc(100dvh - 80px)}
  .overlay.show .sheet-panel{transform:translate(-50%,-50%)}
}
.confirm-panel{
  width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:20px;box-shadow:var(--shadow);transform:scale(.94);transition:transform .18s;
}
.overlay.show .confirm-panel{transform:scale(1)}
.confirm-panel h3{font-size:16px;margin-bottom:8px}
.confirm-panel p{font-size:14px;color:var(--mut);margin-bottom:14px}
.confirm-panel .input{margin-bottom:14px}
.confirm-panel .row{gap:10px}
.confirm-panel .btn{flex:1}
.lightbox img{max-width:100%;max-height:92dvh;border-radius:12px;object-fit:contain}

/* ---------- thumbs / info ---------- */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-bottom:10px}
.thumbs:empty{display:none}
.thumb-wrap{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--panel2)}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.thumb-wrap .rm{
  position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;
  background:#000a;color:#fff;font-size:11px;display:grid;place-items:center;
}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;margin-top:12px}
.info-grid div span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.info-grid div b{font-size:14.5px;font-weight:600}
.notes-block{margin-top:12px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;font-size:14px;white-space:pre-wrap;color:#cbd5e3}
.calc-line{margin-top:10px;font-size:13px;color:var(--gold);min-height:18px}

/* ---------- toasts ---------- */
.toasts{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{
  background:#212B3A;border:1px solid var(--line);color:var(--text);font-size:13.5px;font-weight:550;
  border-radius:999px;padding:9px 18px;box-shadow:var(--shadow);max-width:88vw;
  opacity:0;transform:translateY(-8px);transition:all .25s;
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.win{border-color:#3dce8e66} .toast.err{border-color:#f26d6d66}
.fade-in{animation:fi .25s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="storageWarn" class="banner" hidden>Browser storage is unavailable — the journal will run, but data won't persist after this tab closes.</div>

<header class="top">
  <div class="brand"><span class="logo">▲</span><h1>Trade Journal</h1></div>
  <button id="tierPill" class="tier-pill num" aria-label="Current tier">T1 · $100</button>
</header>

<main id="view" class="view" aria-live="polite"></main>

<button id="fab" class="fab" aria-label="Add trade" hidden>＋</button>

<nav class="tabs" aria-label="Sections">
  <button data-tab="tier" class="on"><svg viewBox="0 0 24 24"><path d="M4 20v-5h5M9 15v-5h5M14 10V5h6"/></svg>Tier</button>
  <button data-tab="trades"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Trades</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 19L9.5 12l4 4L20 7M20 7h-5M20 7v5"/></svg>Stats</button>
  <button data-tab="manage"><svg viewBox="0 0 24 24"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2.2"/><circle cx="7" cy="16" r="2.2"/></svg>Manage</button>
  <button data-tab="backup" id="navBackup"><svg viewBox="0 0 24 24"><path d="M7 17a4.5 4.5 0 01-.4-9A6 6 0 0118 9.5 3.8 3.8 0 0117.5 17H16M12 12v7M9.5 14.5L12 12l2.5 2.5"/></svg>Backup</button>
</nav>

<div id="sheet" class="overlay" hidden></div>
<div id="confirm" class="overlay center" hidden></div>
<div id="lightbox" class="overlay center lightbox" hidden><img alt="Screenshot"></div>
<div id="toasts" class="toasts" aria-live="assertive"></div>

<script>
'use strict';
/* =================== utils =================== */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
const round1 = n => Math.round(n * 10) / 10;

const fmtMoney = (n, signed=false) => {
  const v = Math.abs(n || 0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  return (n < 0 ? '−$' : (signed && n > 0 ? '+$' : '$')) + v;
};
const fmtNum  = n => (Math.round(n * 100) / 100).toLocaleString('en-US', {maximumFractionDigits:2});
const fmtDate = ts => ts ? new Date(ts).toLocaleString(undefined, {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '—';
const fmtDay  = ts => ts ? new Date(ts).toLocaleDateString(undefined, {month:'short', day:'numeric'}) : '—';
const fmtDur  = ms => {
  if (ms == null || ms < 0) return '—';
  const m = Math.round(ms / 60000);
  if (m < 1)  return '<1m';
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60), mm = m % 60;
  if (h < 48) return mm ? `${h}h ${mm}m` : `${h}h`;
  return `${Math.floor(h / 24)}d ${h % 24}h`;
};
const fmtAgo = ts => {
  if (!ts) return 'never';
  const d = Date.now() - ts;
  if (d < 90000) return 'just now';
  if (d < 3600e3) return Math.round(d / 60000) + ' min ago';
  if (d < 48 * 3600e3) return Math.round(d / 3600e3) + ' hours ago';
  return Math.round(d / 86400e3) + ' days ago';
};

/* =================== DB (IndexedDB with in-memory fallback) =================== */
const DB = (() => {
  let db = null, usingMem = false;
  const mem = { trades: new Map(), images: new Map(), meta: new Map() };

  function open() {
    return new Promise(res => {
      if (!window.indexedDB) { usingMem = true; return res(false); }
      let req, settled = false;
      const fallback = () => { if (settled) return; settled = true; usingMem = true; res(false); };
      const ok = () => { if (settled) return; settled = true; res(true); };
      // Never let a blocked/hung open freeze the whole app — fall back to memory after a beat.
      const timer = setTimeout(fallback, 3000);
      try { req = indexedDB.open('tradeJournal', 1); }
      catch (e) { clearTimeout(timer); return fallback(); }
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('trades')) d.createObjectStore('trades', {keyPath:'id'});
        if (!d.objectStoreNames.contains('images')) d.createObjectStore('images', {keyPath:'id'});
        if (!d.objectStoreNames.contains('meta'))   d.createObjectStore('meta',   {keyPath:'key'});
      };
      req.onsuccess = e => { clearTimeout(timer); db = e.target.result; db.onversionchange = () => db.close(); ok(); };
      req.onerror = () => { clearTimeout(timer); fallback(); };
      req.onblocked = () => { clearTimeout(timer); fallback(); };
    });
  }

  function op(store, mode, fns) {
    if (usingMem) return Promise.resolve(fns.mem(mem[store]));
    return new Promise((res, rej) => {
      let r;
      try { r = fns.idb(db.transaction(store, mode).objectStore(store)); }
      catch (e) { return rej(e); }
      r.onsuccess = () => res(r.result);
      r.onerror   = () => rej(r.error);
    });
  }

  return {
    open,
    get:    (s, k) => op(s, 'readonly',  {idb: st => st.get(k),    mem: m => m.get(k)}),
    getAll: s      => op(s, 'readonly',  {idb: st => st.getAll(),  mem: m => [...m.values()]}),
    put:    (s, v) => op(s, 'readwrite', {idb: st => st.put(v),    mem: m => { m.set(v.id ?? v.key, v); }}),
    del:    (s, k) => op(s, 'readwrite', {idb: st => st.delete(k), mem: m => { m.delete(k); }}),
    clear:  s      => op(s, 'readwrite', {idb: st => st.clear(),   mem: m => { m.clear(); }}),
    get usingMemory() { return usingMem; }
  };
})();

const Meta = {
  async get(key, fallback) { const r = await DB.get('meta', key); return r ? r.value : fallback; },
  set: (key, value) => DB.put('meta', {key, value})

/* =================== Img (compression + object-URL cache) =================== */
const Img = (() => {
  const urls = new Map();

  async function compress(file) {
    const srcUrl = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = () => rej(new Error('decode failed'));
        i.src = srcUrl;
      });
      const MAX = 1400;
      const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * scale));
      const h = Math.max(1, Math.round(img.naturalHeight * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.72));
      return (blob && blob.size < file.size) ? blob : file;
    } finally { URL.revokeObjectURL(srcUrl); }
  }

  async function save(file) {
    let blob = file;
    try { blob = await compress(file); } catch (e) { /* store original */ }
    const id = uid();
    await DB.put('images', {id, blob, type: blob.type || 'image/jpeg'});
    return id;
  }

  async function urlFor(id) {
    if (urls.has(id)) return urls.get(id);
    const rec = await DB.get('images', id);
    if (!rec) return null;
    const u = URL.createObjectURL(rec.blob);
    urls.set(id, u);
    return u;
  }

  async function remove(id) { await DB.del('images', id); const u = urls.get(id); if (u) { URL.revokeObjectURL(u); urls.delete(id); } }

  return { save, urlFor, remove };
})();

/* =================== Tier engine =================== */
const Tier = (() => {
  const RR = 2.2;
  const TIER_COUNT = 5;
  // Each tier risks the previous tier's TP profit: $100 → $220 → $484 → $1,064.80 → $2,342.56
  const TIERS = (() => {
    const out = []; let stake = 100;
    for (let i = 0; i < TIER_COUNT; i++) {
      const tp = Math.round(stake * RR * 100) / 100;
      out.push({ n: i + 1, stake: Math.round(stake * 100) / 100, tp });
      stake = tp;
    }
    return out;
  })();
  const MAX = TIERS.length;

  const stake = t => TIERS[t - 1].stake;
  const tp    = t => TIERS[t - 1].tp;

  const closedSorted = trades =>
    trades.filter(t => t.status === 'closed')
          .sort((a, b) => (a.exitTime || a.entryTime || 0) - (b.exitTime || b.entryTime || 0));

  // Tier is always derived by replaying closed trades — self-corrects on edits.
  function path(trades) {
    let cur = 1;
    const pts = [1];
    for (const t of closedSorted(trades)) {
      if (t.outcome === 'win')  cur = Math.min(MAX, cur + 1);
      else if (t.outcome === 'loss') cur = Math.max(1, cur - 1);
      pts.push(cur);
    }
    return pts;
  }
  const current = trades => path(trades).at(-1);

  // Position sizing: risk ÷ SL pips → "mini con" under 10, otherwise ÷10 as "con"
  function conSize(risk, sl) {
    if (!sl || sl <= 0) return null;
    const size = risk / sl;
    return size < 10 ? { value: size, unit: 'mini con' } : { value: size / 10, unit: 'con' };
  }

  return { RR, TIERS, MAX, stake, tp, path, current, conSize, closedSorted };
})();

/* =================== Trades =================== */
const Trades = {
  rMultiple(t) {
    if (t.status !== 'closed' || t.pnl == null) return null;
    const s = Tier.stake(t.tier);
    return s ? t.pnl / s : null;
  },
  holdMs: t => (t.entryTime && t.exitTime) ? t.exitTime - t.entryTime : null,
  all:    () => DB.getAll('trades'),
  save:   t  => DB.put('trades', t),
  remove: id => DB.del('trades', id)
};

/* =================== Stats =================== */
const Stats = {
  compute(trades) {
    const closed = Tier.closedSorted(trades);
    if (!closed.length) return null;

    const wins   = closed.filter(t => t.outcome === 'win').length;
    const losses = closed.filter(t => t.outcome === 'loss').length;
    const bes    = closed.filter(t => t.outcome === 'be').length;
    const pnls   = closed.map(t => t.pnl || 0);
    const total  = pnls.reduce((a, b) => a + b, 0);
    const rs     = closed.map(t => Trades.rMultiple(t) ?? 0);
    const totalR = rs.reduce((a, b) => a + b, 0);
    const grossW = pnls.filter(p => p > 0).reduce((a, b) => a + b, 0);
    const grossL = Math.abs(pnls.filter(p => p < 0).reduce((a, b) => a + b, 0));

    // Streaks (break-even trades are neutral — they don't extend or break a streak)
    let run = 0, runType = null, maxWin = 0, maxLoss = 0;
    for (const t of closed) {
      if (t.outcome === 'be') continue;
      if (t.outcome === runType) run++; else { runType = t.outcome; run = 1; }
      if (runType === 'win') maxWin = Math.max(maxWin, run);
      else maxLoss = Math.max(maxLoss, run);
    }

    const holds = closed.map(Trades.holdMs).filter(v => v != null);
    const rrs   = closed.map(t => t.rr).filter(v => v > 0);

    let eq = 0;
    const equity = [0, ...closed.map(t => (eq += t.pnl || 0))];

    const groupBy = kind => {
      const m = new Map();
      for (const t of closed) {
        const keys = kind === 'setup'
          ? ((t.setups && t.setups.length) ? t.setups : ['(no setup)'])
          : [kind === 'pair' ? t.pair : 'Tier ' + t.tier];
        for (const k of keys) {
          const g = m.get(k) || { n: 0, w: 0, pnl: 0 };
          g.n++; if (t.outcome === 'win') g.w++; g.pnl += t.pnl || 0;
          m.set(k, g);
        }
      }
      return [...m.entries()].sort((a, b) => b[1].pnl - a[1].pnl);
    };

    return {
      n: closed.length, wins, losses, bes,
      winRate: wins / closed.length * 100,
      total, avg: total / closed.length,
      totalR, avgR: totalR / closed.length,
      profitFactor: grossL ? grossW / grossL : (grossW ? Infinity : 0),
      largestWin: Math.max(0, ...pnls),
      largestLoss: Math.min(0, ...pnls),
      curStreak: run, curType: runType, maxWin, maxLoss,
      avgHold: holds.length ? holds.reduce((a, b) => a + b, 0) / holds.length : null,
      avgRR:   rrs.length   ? rrs.reduce((a, b) => a + b, 0) / rrs.length   : null,
      equity,
      bySetup: groupBy('setup'), byPair: groupBy('pair'), byTier: groupBy('tier')
    };
  }
};

/* =================== Zip (STORE-only writer, no dependencies) =================== */
const Zip = (() => {
  const TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  const crc32 = u8 => {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < u8.length; i++) c = TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  };
  const dosDT = d => ({
    time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
    date: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()
  });

  function build(files) { // files: [{name, data:Uint8Array}]
    const enc = new TextEncoder();
    const now = dosDT(new Date());
    const parts = [], central = [];
    let offset = 0;

    for (const f of files) {
      const name = enc.encode(f.name);
      const c = crc32(f.data);

      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);          // version needed
      lh.setUint16(6, 0x0800, true);      // UTF-8 names
      lh.setUint16(8, 0, true);           // method: store
      lh.setUint16(10, now.time, true);
      lh.setUint16(12, now.date, true);
      lh.setUint32(14, c, true);
      lh.setUint32(18, f.data.length, true);
      lh.setUint32(22, f.data.length, true);
      lh.setUint16(26, name.length, true);
      parts.push(lh.buffer, name, f.data);

      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true);
      ch.setUint16(12, now.time, true);
      ch.setUint16(14, now.date, true);
      ch.setUint32(16, c, true);
      ch.setUint32(20, f.data.length, true);
      ch.setUint32(24, f.data.length, true);
      ch.setUint16(28, name.length, true);
      ch.setUint32(42, offset, true);
      central.push(ch.buffer, name);

      offset += 30 + name.length + f.data.length;
    }

    const cdSize = central.reduce((a, b) => a + b.byteLength, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true);
    end.setUint32(16, offset, true);

    return new Blob([...parts, ...central, end.buffer], {type: 'application/zip'});
  }

  return { build };
})();

/* =================== Backup =================== */
const Backup = (() => {
  const blobToDataURL = blob => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });

  const stamp = () => new Date().toISOString().slice(0, 10);

  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }

  async function basePayload() {
    return {
      app: 'trade-journal', version: 1,
      exportedAt: new Date().toISOString(),
      trades: await Trades.all(),
      pairs:  await Meta.get('pairs', []),
      setups: await Meta.get('setups', [])
    };
  }

  async function exportJSON() {
    const data = await basePayload();
    const imgs = await DB.getAll('images');
    data.images = [];
    for (const im of imgs) {
      data.images.push({ id: im.id, type: im.type, dataUrl: await blobToDataURL(im.blob) });
    }
    download(new Blob([JSON.stringify(data)], {type:'application/json'}), `trade-journal-${stamp()}.json`);
    await Meta.set('lastBackup', Date.now());
  }

  async function exportZIP() {
    const data = await basePayload();
    const imgs = await DB.getAll('images');
    const ext = t => t === 'image/png' ? 'png' : (t === 'image/webp' ? 'webp' : 'jpg');
    data.imageFiles = {};
    const files = [];
    for (const im of imgs) {
      const name = `images/${im.id}.${ext(im.type)}`;
      data.imageFiles[im.id] = name;
      files.push({ name, data: new Uint8Array(await im.blob.arrayBuffer()) });
    }
    const enc = new TextEncoder();
    files.unshift({ name: 'journal.json', data: enc.encode(JSON.stringify(data, null, 1)) });
    files.push({ name: 'README.txt', data: enc.encode(
      'Trade Journal export\n\njournal.json holds every trade; images/ holds the screenshots.\n' +
      'For a full restore across devices, use the JSON backup (it embeds the screenshots).\n'
    )});
    download(Zip.build(files), `trade-journal-${stamp()}.zip`);
    await Meta.set('lastBackup', Date.now());
  }

  async function importJSON(file) {
    let data;
    try { data = JSON.parse(await file.text()); }
    catch (e) { throw new Error("That file isn't valid JSON."); }
    if (data.app !== 'trade-journal' || !Array.isArray(data.trades)) {
      throw new Error("This doesn't look like a Trade Journal backup.");
    }
    await DB.clear('trades');
    await DB.clear('images');
    for (const t of data.trades) if (t && t.id) await DB.put('trades', t);
    if (Array.isArray(data.images)) {
      for (const im of data.images) {
        if (!im || !im.id || !im.dataUrl) continue;
        try {
          const blob = await (await fetch(im.dataUrl)).blob();
          await DB.put('images', { id: im.id, blob, type: im.type || blob.type });
        } catch (e) { /* skip a corrupt image, keep restoring */ }
      }
    }
    if (Array.isArray(data.pairs))  await Meta.set('pairs',  data.pairs);
    if (Array.isArray(data.setups)) await Meta.set('setups', data.setups);
    return data.trades.length;
  }

  async function eraseAll() {
    await DB.clear('trades');
    await DB.clear('images');
    await DB.clear('meta');
  }

  return { exportJSON, exportZIP, importJSON, eraseAll };
})();

/* ---------- confirm dialog (promise-based, stacks above sheets) ---------- */
function confirmDialog({title, body, okText = 'OK', danger = false, requireText = null}) {
  return new Promise(resolve => {
    const o = $('#confirm');
    o.innerHTML = `
      <div class="confirm-panel" role="alertdialog" aria-label="${esc(title)}">
        <h3>${esc(title)}</h3>
        <p>${esc(body)}</p>
        ${requireText ? `<input class="input" id="cfInput" placeholder="Type ${esc(requireText)} to confirm" autocomplete="off" autocapitalize="characters">` : ''}
        <div class="row">
          <button class="btn" data-act="no">Cancel</button>
          <button class="btn ${danger ? 'danger' : 'primary'}" data-act="yes" ${requireText ? 'disabled' : ''}>${esc(okText)}</button>
        </div>
      </div>`;
    o.hidden = false;
    requestAnimationFrame(() => o.classList.add('show'));
    const done = ok => {
      o.classList.remove('show');
      setTimeout(() => { o.hidden = true; o.innerHTML = ''; }, 200);
      resolve(ok);
    };
    if (requireText) {
      const inp = $('#cfInput', o), yes = $('[data-act="yes"]', o);
      inp.addEventListener('input', () => { yes.disabled = inp.value.trim().toUpperCase() !== requireText; });
      setTimeout(() => inp.focus(), 60);
    }
    $('[data-act="no"]', o).onclick = () => done(false);
    $('[data-act="yes"]', o).onclick = () => done(true);
    o.onclick = e => { if (e.target === o) done(false); };
  });
}

const Sheet = {
  guard: null,
  open(title, bodyHTML, {footHTML = '', guard = null} = {}) {
    this.guard = guard;
    const o = $('#sheet');
    o.innerHTML = `
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Close">✕</button></div>
        <div class="sheet-body"></div>
        ${footHTML ? `<div class="sheet-foot">${footHTML}</div>` : ''}
      </div>`;
    $('.sheet-body', o).innerHTML = bodyHTML;
    o.hidden = false;
    requestAnimationFrame(() => o.classList.add('show'));
    $('[data-close]', o).onclick = () => this.tryClose();
    o.onclick = e => { if (e.target === o) this.tryClose(); };
    return o;
  },
  isOpen() { return !$('#sheet').hidden; },
  async tryClose() {
    if (this.guard && this.guard()) {
      const ok = await confirmDialog({
        title: 'Discard changes?',
        body: "You have unsaved changes. They'll be lost if you close this.",
        okText: 'Discard', danger: true
      });
      if (!ok) return;
    }
    this.close();
  },
  close() {
    this.guard = null;
    State.formDirty = false;
    const o = $('#sheet');
    o.classList.remove('show');
    setTimeout(() => { o.hidden = true; o.innerHTML = ''; }, 240);

/* =================== charts (inline SVG) =================== */
function tierPathSVG(pts) {
  if (pts.length < 2) return '<p class="hint">Close trades and your climb will trace itself here.</p>';
  const max = Tier.MAX;
  const w = Math.max(300, (pts.length - 1) * 26 + 28), h = 116, pad = 14;
  const x = i => pad + i * (w - 2 * pad) / (pts.length - 1);
  const y = t => h - pad - (t - 1) * (h - 2 * pad) / (max - 1);
  let d = `M ${x(0)} ${y(pts[0])}`;
  for (let i = 1; i < pts.length; i++) d += ` L ${x(i)} ${y(pts[i - 1])} L ${x(i)} ${y(pts[i])}`;
  const grid = Tier.TIERS.map(({n: t}) =>
    `<line x1="${pad}" x2="${w - pad}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="2 4"/>
     <text x="2" y="${y(t) + 3.5}" font-size="9" fill="var(--mut2)">T${t}</text>`).join('');
  const dots = pts.map((t, i) => {
    const col = i === 0 ? 'var(--mut2)' : (t > pts[i - 1] ? 'var(--win)' : t < pts[i - 1] ? 'var(--loss)' : 'var(--mut)');
    return `<circle cx="${x(i)}" cy="${y(t)}" r="3.2" fill="${col}"/>`;
  }).join('');
  return `<div class="path-wrap"><svg class="chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Tier path">
    ${grid}<path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2"/>${dots}</svg></div>`;
}

function equitySVG(eq) {
  const w = 600, h = 190, pad = 16;
  const min = Math.min(0, ...eq), max = Math.max(0, ...eq);
  const rng = (max - min) || 1;
  const x = i => eq.length === 1 ? w / 2 : pad + i * (w - 2 * pad) / (eq.length - 1);
  const y = v => h - pad - (v - min) * (h - 2 * pad) / rng;
  const pts = eq.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const last = eq.at(-1);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Equity curve">
    <line x1="${pad}" x2="${w - pad}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <polygon points="${pad},${y(0)} ${pts} ${x(eq.length - 1)},${y(0)}" fill="${last >= 0 ? 'var(--win-soft)' : 'var(--loss-soft)'}"/>
    <polyline points="${pts}" fill="none" stroke="${last >= 0 ? 'var(--win)' : 'var(--loss)'}" stroke-width="2"/>
    <circle cx="${x(eq.length - 1)}" cy="${y(last)}" r="3.5" fill="${last >= 0 ? 'var(--win)' : 'var(--loss)'}"/>
  </svg>`;
}

            `<option value="${x.n}" ${x.n === cur ? 'selected' : ''}>T${x.n} · $${fmtNum(x.stake)}</option>`).join('')}</select>
        </div>
        <div class="field" style="margin-top:0"><label>R:R</label>
          <input id="calcRR" class="input num" type="number" step="any" inputmode="decimal" value="${Tier.RR}">
        </div>
        <div class="field" style="margin-top:0"><label>SL pips</label>
          <input id="calcSL" class="input num" type="number" step="any" inputmode="decimal" placeholder="e.g. 25">
        </div>
      </div>
      <div class="calc-out num" id="calcOut"></div>
    </div>`;

  const update = () => {
    const tier = parseInt($('#calcTier').value, 10);
    const rr = num($('#calcRR').value) ?? Tier.RR;
    const sl = num($('#calcSL').value);
    const out = $('#calcOut');
    if (!sl || sl <= 0) {
      out.innerHTML = `<div><span>TP pips</span><b>—</b></div><div><span>Risk</span><b>${fmtMoney(Tier.stake(tier))}</b></div><div class="size"><span>Size</span><b>—</b></div>`;
      return;
    }
    const size = Tier.conSize(Tier.stake(tier), sl);
    out.innerHTML = `
      <div><span>TP pips</span><b>${fmtNum(round1(sl * rr))}</b></div>
      <div><span>Risk</span><b>${fmtMoney(Tier.stake(tier))}</b></div>
      <div class="size"><span>Size</span><b>${fmtNum(size.value)} ${size.unit}</b></div>`;
  };
  ['calcTier', 'calcRR', 'calcSL'].forEach(id => $('#' + id).addEventListener('input', update));
  update();
}

/* =================== TRADES tab =================== */
function tradeCard(t) {
  const cls = t.status === 'open' ? 'open' : t.outcome;
  const r = Trades.rMultiple(t);
  const line2 = t.status === 'open'
    ? `SL ${fmtNum(t.slPips)} · TP ${fmtNum(t.tpPips)} · ${fmtNum(t.rr)} R:R · opened ${fmtDate(t.entryTime)}`
    : `${r != null ? (r >= 0 ? '+' : '−') + fmtNum(Math.abs(r)) + 'R · ' : ''}held ${fmtDur(Trades.holdMs(t))} · closed ${fmtDay(t.exitTime)}`;
  const pnl = t.status === 'closed'
    ? `<span class="pnl num ${t.pnl > 0 ? 'pos' : t.pnl < 0 ? 'neg' : ''}">${fmtMoney(t.pnl, true)}</span>`
    : `<span class="pnl badge open">Open</span>`;
  return `
    <button class="trade ${cls} fade-in" data-id="${esc(t.id)}">
      <div class="t1">
        <span class="pair">${esc(t.pair)}</span>
        <span class="badge ${t.direction}">${t.direction}</span>
        <span class="badge tier num">T${t.tier}</span>
        ${pnl}
      </div>
      <div class="t2 num">${line2}</div>
      ${(t.setups && t.setups.length) ? `<div class="tags">${t.setups.map(s => `<span class="tag">${esc(s)}</span>`).join('')}</div>` : ''}
    </button>`;
}

function renderTrades() {
  const f = State.filters;
  const pairs  = [...new Set([...State.pairs, ...State.trades.map(t => t.pair)])].filter(Boolean).sort();
  const setups = [...new Set([...State.setups, ...State.trades.flatMap(t => t.setups || [])])].filter(Boolean).sort();
  if (f.pair !== 'all' && !pairs.includes(f.pair)) f.pair = 'all';
  if (f.setup !== 'all' && !setups.includes(f.setup)) f.setup = 'all';

  let list = State.trades;
  if (f.pair !== 'all')  list = list.filter(t => t.pair === f.pair);
  if (f.setup !== 'all') list = list.filter(t => (t.setups || []).includes(f.setup));
  const open   = list.filter(t => t.status === 'open').sort((a, b) => (b.entryTime || 0) - (a.entryTime || 0));
  const closed = list.filter(t => t.status === 'closed').sort((a, b) => (b.exitTime || 0) - (a.exitTime || 0));

  const opt = (v, cur, label) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label)}</option>`;

  let html = `
    <div class="filters">
      <div class="seg" id="fltStatus">
        ${['all', 'open', 'closed'].map(s => `<button data-v="${s}" class="${f.status === s ? 'on' : ''}">${s[0].toUpperCase() + s.slice(1)}</button>`).join('')}
      </div>
      <div class="row">
        <select id="fltPair" class="input">${opt('all', f.pair, 'All pairs')}${pairs.map(p => opt(p, f.pair, p)).join('')}</select>
        <select id="fltSetup" class="input">${opt('all', f.setup, 'All setups')}${setups.map(s => opt(s, f.setup, s)).join('')}</select>
      </div>
    </div>`;

  if (!State.trades.length) {
    html += `
      <div class="empty">
        <div class="glyph">◮</div>
        <p>No trades yet. Log your first entry and the journal takes it from there.</p>
        <button class="btn primary" id="emptyAdd">＋ Log your first trade</button>
      </div>`;
  } else {
    if (f.status !== 'closed') {
      html += `<div class="sec-h"><h2>Open</h2><span class="count num">${open.length}</span></div>`;
      html += open.length ? open.map(tradeCard).join('') : `<p class="hint">Nothing open${f.pair !== 'all' || f.setup !== 'all' ? ' for these filters' : ''}.</p>`;
    }
    if (f.status !== 'open') {
      html += `<div class="sec-h"><h2>Closed</h2><span class="count num">${closed.length}</span></div>`;
      html += closed.length ? closed.map(tradeCard).join('') : `<p class="hint">No closed trades${f.pair !== 'all' || f.setup !== 'all' ? ' for these filters' : ''}.</p>`;
    }
  }
  view.innerHTML = html;

  $$('#fltStatus button').forEach(b => b.onclick = () => { f.status = b.dataset.v; renderTrades(); });
  $('#fltPair').onchange  = e => { f.pair  = e.target.value; renderTrades(); };
  $('#fltSetup').onchange = e => { f.setup = e.target.value; renderTrades(); };
  $('#emptyAdd')?.addEventListener('click', () => openTradeForm());
  $$('.trade').forEach(el => el.onclick = () => {
    const t = State.trades.find(x => x.id === el.dataset.id);
    if (t) openDetail(t);
  });
}

/* =================== STATS tab =================== */
function statCard(label, value, extra = '') {
  return `<div class="stat"><span>${label}</span><b class="num">${value}</b>${extra ? `<small>${extra}</small>` : ''}</div>`;
}
function breakdownCard(title, rows) {
  return `<div class="card"><h3>${esc(title)}</h3><table class="tbl num"><thead>
    <tr><th></th><th>Trades</th><th>Win %</th><th>P&amp;L</th></tr></thead><tbody>
    ${rows.map(([k, g]) => `<tr><td>${esc(k)}</td><td>${g.n}</td><td>${Math.round(g.w / g.n * 100)}%</td>
      <td class="${g.pnl > 0 ? 'pos' : g.pnl < 0 ? 'neg' : ''}">${fmtMoney(g.pnl, true)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function renderStats() {
  const s = Stats.compute(State.trades);
  if (!s) {
    view.innerHTML = `
      <div class="empty">
        <div class="glyph">▤</div>
        <p>Stats appear once you've closed your first trade — win rate, expectancy, streaks, equity curve and more.</p>
        <button class="btn" id="goTrades">Go to trades</button>
      </div>`;
    $('#goTrades').onclick = () => switchTab('trades');
    return;
  }
  const pf = s.profitFactor === Infinity ? '∞' : fmtNum(s.profitFactor);
  const streak = s.curType ? `${s.curStreak} ${s.curType === 'win' ? 'win' : 'loss'}${s.curStreak > 1 ? 's' : ''}` : '—';
  view.innerHTML = `
    <div class="stat-grid fade-in">
      ${statCard('Win rate', Math.round(s.winRate) + '%', `${s.wins}W · ${s.losses}L · ${s.bes}BE`)}
      ${statCard('Net P&L', `<span class="${s.total > 0 ? 'pos' : s.total < 0 ? 'neg' : ''}">${fmtMoney(s.total, true)}</span>`, s.n + ' trades')}
      ${statCard('Profit factor', pf)}
      ${statCard('Expectancy', (s.avgR >= 0 ? '+' : '−') + fmtNum(Math.abs(s.avgR)) + 'R', 'per trade')}
      ${statCard('Avg P&L', fmtMoney(s.avg, true))}
      ${statCard('Total R', (s.totalR >= 0 ? '+' : '−') + fmtNum(Math.abs(s.totalR)) + 'R')}
      ${statCard('Largest win', `<span class="pos">${fmtMoney(s.largestWin, true)}</span>`)}
      ${statCard('Largest loss', `<span class="${s.largestLoss < 0 ? 'neg' : ''}">${fmtMoney(s.largestLoss, true)}</span>`)}
      ${statCard('Current streak', streak)}
      ${statCard('Best / worst', `${s.maxWin}W · ${s.maxLoss}L`)}
      ${statCard('Avg hold', fmtDur(s.avgHold))}
      ${statCard('Avg R:R', s.avgRR != null ? fmtNum(s.avgRR) : '—')}
    </div>
    <div class="card"><h3>Equity curve</h3>${equitySVG(s.equity)}</div>
    ${breakdownCard('By setup', s.bySetup)}
    ${breakdownCard('By pair', s.byPair)}
    ${breakdownCard('By tier', s.byTier)}`;
}

/* =================== trade form (open / edit details) =================== */
function openTradeForm(existing) {
  const isEdit = !!existing;
  const cur = Tier.current(State.trades);
  const f = {
    pair: existing?.pair || State.pairs[0] || '',
    direction: existing?.direction || 'long',
    tier: existing?.tier || cur,
    rr: existing?.rr ?? Tier.RR,
    sl: existing?.slPips ?? '',
    tp: existing?.tpPips ?? '',
    setups: new Set(existing?.setups || []),
    notes: existing?.notes || ''
  };
  let tpTouched = isEdit && f.tp !== '';
  let newFiles = [];                                   // {file, url}
  let keptImgs = [...(existing?.entryImgs || [])];     // existing image ids kept
  const removedImgs = [];

  const pairList = [...new Set([...State.pairs, ...(f.pair ? [f.pair] : [])])];

  Sheet.open(isEdit ? 'Edit trade' : 'New trade', `
    <div class="field"><label>Pair</label>
      <div class="chips" id="fPair">
        ${pairList.length ? pairList.map(p => `<button type="button" class="chip ${p === f.pair ? 'on' : ''}" data-v="${esc(p)}">${esc(p)}</button>`).join('')
          : '<span class="hint">Add pairs in the Manage tab first.</span>'}
      </div>
    </div>
    <div class="field"><label>Direction</label>
      <div class="seg" id="fDir">
        <button type="button" data-v="long" class="win ${f.direction === 'long' ? 'on' : ''}">Long</button>
        <button type="button" data-v="short" class="loss ${f.direction === 'short' ? 'on' : ''}">Short</button>
      </div>
    </div>
    <div class="field"><label>Tier</label>
      <div class="seg" id="fTier">
        ${Tier.TIERS.map(t => `<button type="button" data-v="${t.n}" class="gold ${t.n === f.tier ? 'on' : ''}">T${t.n}<small class="num">$${Math.round(t.stake).toLocaleString('en-US')}</small></button>`).join('')}
      </div>
    </div>
    <div class="row3">
      <div class="field"><label>R : R</label><input id="fRR" class="input num" type="number" step="any" inputmode="decimal" value="${esc(f.rr)}"></div>
      <div class="field"><label>SL pips</label><input id="fSL" class="input num" type="number" step="any" inputmode="decimal" value="${esc(f.sl)}" placeholder="25"></div>
      <div class="field"><label>TP pips</label><input id="fTP" class="input num" type="number" step="any" inputmode="decimal" value="${esc(f.tp)}" placeholder="auto"></div>
    </div>
    <div class="calc-line num" id="fCalc"></div>
    <div class="field"><label>Setups</label>
      <div class="chips" id="fSetups">
        ${State.setups.length ? State.setups.map(s => `<button type="button" class="chip ${f.setups.has(s) ? 'on' : ''}" data-v="${esc(s)}">${esc(s)}</button>`).join('')
          : '<span class="hint">Add setup tags in the Manage tab.</span>'}
      </div>
    </div>
    <div class="field"><label>Entry screenshots</label>
      <div class="thumbs" id="fThumbs"></div>
      <button type="button" class="btn ghost small" id="fAddImg">＋ Add screenshots</button>
      <input id="fFiles" type="file" accept="image/*" multiple hidden>
    </div>
    <div class="field"><label>Notes</label>
      <textarea id="fNotes" class="input" rows="3" placeholder="Why this trade?">${esc(f.notes)}</textarea>
    </div>`,
    { footHTML: `<button class="btn primary" id="fSave">${isEdit ? 'Save changes' : 'Open trade'}</button>`,
      guard: () => State.formDirty });

  const dirty = () => { State.formDirty = true; };

  const renderThumbs = () => {
    const el = $('#fThumbs');
    el.innerHTML =
      keptImgs.map(id => `<div class="thumb-wrap"><img data-img="${esc(id)}" alt="Screenshot"><button type="button" class="rm" data-old="${esc(id)}" aria-label="Remove">✕</button></div>`).join('') +
      newFiles.map((n, i) => `<div class="thumb-wrap"><img src="${n.url}" alt="New screenshot"><button type="button" class="rm" data-new="${i}" aria-label="Remove">✕</button></div>`).join('');
    hydrateImgs(el);
    $$('.rm', el).forEach(b => b.onclick = e => {
      e.stopPropagation();
      if (b.dataset.old) { removedImgs.push(b.dataset.old); keptImgs = keptImgs.filter(x => x !== b.dataset.old); }
      else { const n = newFiles.splice(+b.dataset.new, 1)[0]; URL.revokeObjectURL(n.url); }
      dirty(); renderThumbs();
    });
  };
  renderThumbs();

  const updateCalc = () => {
    const sl = num($('#fSL').value);
    const risk = Tier.stake(f.tier);
    const size = sl ? Tier.conSize(risk, sl) : null;
    $('#fCalc').textContent = size
      ? `Risk ${fmtMoney(risk)} · size ${fmtNum(size.value)} ${size.unit}`
      : `Risk ${fmtMoney(risk)} — enter SL pips to size the position`;
  };
  const autoTP = () => {
    if (tpTouched) return;
    const sl = num($('#fSL').value), rr = num($('#fRR').value) ?? Tier.RR;
    $('#fTP').value = (sl && sl > 0) ? round1(sl * rr) : '';
  };

  const wireChips = (id, fn, multi = false) => $$('#' + id + ' .chip, #' + id + ' button[data-v]').forEach(b => b.onclick = () => {
    if (!multi) { $$('#' + id + ' .on').forEach(x => x.classList.remove('on')); b.classList.add('on'); }
    else b.classList.toggle('on');
    fn(b.dataset.v, b.classList.contains('on'));
    dirty();
  });
  wireChips('fPair', v => { f.pair = v; });
  wireChips('fDir', v => { f.direction = v; });
  wireChips('fTier', v => { f.tier = +v; updateCalc(); });
  wireChips('fSetups', (v, on) => { on ? f.setups.add(v) : f.setups.delete(v); }, true);

  $('#fRR').addEventListener('input', () => { dirty(); autoTP(); });
  $('#fSL').addEventListener('input', () => { dirty(); autoTP(); updateCalc(); });
  $('#fTP').addEventListener('input', () => { tpTouched = true; dirty(); });
  $('#fNotes').addEventListener('input', dirty);
  $('#fAddImg').onclick = () => $('#fFiles').click();
  $('#fFiles').addEventListener('change', e => {
    for (const file of e.target.files) {
      if (!file.type.startsWith('image/')) { toast('Skipped a non-image file', 'err'); continue; }
      newFiles.push({ file, url: URL.createObjectURL(file) });
    }
    e.target.value = '';
    dirty(); renderThumbs();
  });
  updateCalc(); autoTP();

  $('#fSave').onclick = async () => {
    const rr = num($('#fRR').value), sl = num($('#fSL').value), tp = num($('#fTP').value);
    if (!f.pair) return toast('Pick a pair first', 'err');
    if (!rr || rr <= 0) return toast('R:R must be above 0', 'err');
    if (!sl || sl <= 0) return toast('SL pips must be above 0', 'err');
    const btn = $('#fSave');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const newIds = [];
      for (const n of newFiles) { newIds.push(await Img.save(n.file)); URL.revokeObjectURL(n.url); }
      for (const id of removedImgs) await Img.remove(id);
      const t = existing ? { ...existing } : { id: uid(), status: 'open', entryTime: Date.now(), exitImgs: [] };
      Object.assign(t, {
        pair: f.pair, direction: f.direction, tier: f.tier, rr,
        slPips: sl, tpPips: tp ?? round1(sl * rr),
        setups: [...f.setups], notes: $('#fNotes').value.trim(),
        entryImgs: [...keptImgs, ...newIds]
      });
      await Trades.save(t);
      State.formDirty = false;
      Sheet.close();
      await refresh();
      toast(isEdit ? 'Trade updated' : `Trade opened · T${t.tier} risking ${fmtMoney(Tier.stake(t.tier))}`, 'win');
    } catch (err) {
      btn.disabled = false; btn.textContent = isEdit ? 'Save changes' : 'Open trade';
      toast('Could not save the trade', 'err');
    }
  };
}

/* =================== close / edit-result form =================== */
function openCloseForm(trade) {
  const reclose = trade.status === 'closed';
  const stakeV = Tier.stake(trade.tier), tpV = Tier.tp(trade.tier);
  let outcome = reclose ? trade.outcome : null;
  let pnlTouched = reclose;
  let newFiles = [];
  let keptImgs = [...(trade.exitImgs || [])];
  const removedImgs = [];

  Sheet.open(reclose ? 'Edit result' : `Close ${trade.pair}`, `
    <div class="field"><label>Outcome</label>
      <div class="seg" id="cOut">
        <button type="button" data-v="win" class="win ${outcome === 'win' ? 'on' : ''}">Win<small class="num">+$${fmtNum(tpV)}</small></button>
        <button type="button" data-v="be" class="${outcome === 'be' ? 'on' : ''}">BE<small class="num">$0</small></button>
        <button type="button" data-v="loss" class="loss ${outcome === 'loss' ? 'on' : ''}">Loss<small class="num">−$${fmtNum(stakeV)}</small></button>
      </div>
    </div>
    <div class="field"><label>P&amp;L ($)</label>
      <input id="cPnl" class="input num" type="number" step="any" inputmode="decimal" value="${reclose ? esc(trade.pnl) : ''}" placeholder="Auto-fills from outcome">
    </div>
    <div class="field"><label>Exit screenshots</label>
      <div class="thumbs" id="cThumbs"></div>
      <button type="button" class="btn ghost small" id="cAddImg">＋ Add screenshots</button>
      <input id="cFiles" type="file" accept="image/*" multiple hidden>
    </div>
    <div class="field"><label>Close notes</label>
      <textarea id="cNotes" class="input" rows="3" placeholder="How did it play out?">${esc(trade.closeNotes || '')}</textarea>
    </div>`,
    { footHTML: `<button class="btn primary" id="cSave">${reclose ? 'Save changes' : 'Close trade'}</button>`,
      guard: () => State.formDirty });

  const dirty = () => { State.formDirty = true; };

  const renderThumbs = () => {
    const el = $('#cThumbs');
    el.innerHTML =
      keptImgs.map(id => `<div class="thumb-wrap"><img data-img="${esc(id)}" alt="Screenshot"><button type="button" class="rm" data-old="${esc(id)}" aria-label="Remove">✕</button></div>`).join('') +
      newFiles.map((n, i) => `<div class="thumb-wrap"><img src="${n.url}" alt="New screenshot"><button type="button" class="rm" data-new="${i}" aria-label="Remove">✕</button></div>`).join('');
    hydrateImgs(el);
    $$('.rm', el).forEach(b => b.onclick = e => {
      e.stopPropagation();
      if (b.dataset.old) { removedImgs.push(b.dataset.old); keptImgs = keptImgs.filter(x => x !== b.dataset.old); }
      else { const n = newFiles.splice(+b.dataset.new, 1)[0]; URL.revokeObjectURL(n.url); }
      dirty(); renderThumbs();
    });
  };
  renderThumbs();

  $$('#cOut button').forEach(b => b.onclick = () => {
    $$('#cOut .on').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    outcome = b.dataset.v;
    if (!pnlTouched) $('#cPnl').value = outcome === 'win' ? tpV : outcome === 'loss' ? -stakeV : 0;
    dirty();
  });
  $('#cPnl').addEventListener('input', () => { pnlTouched = true; dirty(); });
  $('#cNotes').addEventListener('input', dirty);
  $('#cAddImg').onclick = () => $('#cFiles').click();
  $('#cFiles').addEventListener('change', e => {
    for (const file of e.target.files) {
      if (!file.type.startsWith('image/')) { toast('Skipped a non-image file', 'err'); continue; }
      newFiles.push({ file, url: URL.createObjectURL(file) });
    }
    e.target.value = '';
    dirty(); renderThumbs();
  });

  $('#cSave').onclick = async () => {
    if (!outcome) return toast('Pick an outcome first', 'err');
    const pnl = num($('#cPnl').value);
    if (pnl == null) return toast('P&L is missing', 'err');
    const btn = $('#cSave');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const before = Tier.current(State.trades);
      const newIds = [];
      for (const n of newFiles) { newIds.push(await Img.save(n.file)); URL.revokeObjectURL(n.url); }
      for (const id of removedImgs) await Img.remove(id);
      const t = { ...trade, status: 'closed', outcome, pnl,
        exitTime: trade.exitTime || Date.now(),
        closeNotes: $('#cNotes').value.trim(),
        exitImgs: [...keptImgs, ...newIds] };
      await Trades.save(t);
      State.formDirty = false;
      Sheet.close();
      await refresh();
      const after = Tier.current(State.trades);
      toast(before !== after
        ? `${outcome === 'win' ? 'Win' : outcome === 'loss' ? 'Loss' : 'Break-even'} logged · Tier ${before} → ${after}`
        : (reclose ? 'Result updated' : 'Trade closed'), outcome === 'loss' ? 'err' : 'win');
    } catch (err) {
      btn.disabled = false; btn.textContent = reclose ? 'Save changes' : 'Close trade';
      toast('Could not save', 'err');
    }
  };
}

/* =================== detail sheet =================== */
function openDetail(t) {
  const r = Trades.rMultiple(t);
  const isOpen = t.status === 'open';
  const info = [
    ['Direction', `<span class="${t.direction === 'long' ? 'pos' : 'neg'}" style="text-transform:capitalize">${esc(t.direction)}</span>`],
    ['Tier', `T${t.tier} · ${fmtMoney(Tier.stake(t.tier))}`],
    ['SL / TP pips', `${fmtNum(t.slPips)} / ${fmtNum(t.tpPips)}`],
    ['R : R', fmtNum(t.rr)],
    ['Opened', fmtDate(t.entryTime)],
    isOpen ? ['Status', '<span style="color:var(--open)">Open</span>'] : ['Closed', fmtDate(t.exitTime)],
    ...(!isOpen ? [
      ['P&L', `<span class="${t.pnl > 0 ? 'pos' : t.pnl < 0 ? 'neg' : ''}">${fmtMoney(t.pnl, true)}</span>`],
      ['R multiple', r != null ? `${r >= 0 ? '+' : '−'}${fmtNum(Math.abs(r))}R` : '—'],
      ['Hold time', fmtDur(Trades.holdMs(t))]
    ] : [])
  ];

  const foot = isOpen
    ? `<button class="btn primary" id="dClose">Close trade</button><button class="btn" id="dEdit">Edit</button><button class="btn danger ghost" id="dDel" aria-label="Delete">🗑</button>`
    : `<button class="btn primary" id="dResult">Edit result</button><button class="btn" id="dEdit">Edit details</button><button class="btn danger ghost" id="dDel" aria-label="Delete">🗑</button>`;

  const o = Sheet.open(t.pair, `
    <div class="info-grid num">${info.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>
    ${(t.setups && t.setups.length) ? `<div class="tags" style="margin-top:12px">${t.setups.map(s => `<span class="tag">${esc(s)}</span>`).join('')}</div>` : ''}
    ${t.notes ? `<div class="notes-block">${esc(t.notes)}</div>` : ''}
    ${(t.entryImgs && t.entryImgs.length) ? `<div class="field"><label>Entry screenshots</label>${thumbsHTML(t.entryImgs)}</div>` : ''}
    ${t.closeNotes ? `<div class="field"><label>Close notes</label><div class="notes-block" style="margin-top:0">${esc(t.closeNotes)}</div></div>` : ''}
    ${(t.exitImgs && t.exitImgs.length) ? `<div class="field"><label>Exit screenshots</label>${thumbsHTML(t.exitImgs)}</div>` : ''}`,
    { footHTML: foot });
  hydrateImgs(o);

  $('#dEdit', o).onclick = () => openTradeForm(t);
  $('#dClose', o) && ($('#dClose', o).onclick = () => openCloseForm(t));
  $('#dResult', o) && ($('#dResult', o).onclick = () => openCloseForm(t));
  $('#dDel', o).onclick = async () => {
    const ok = await confirmDialog({
      title: 'Delete this trade?',
      body: `${t.pair} and its screenshots will be removed. Your tier recalculates automatically.`,
      okText: 'Delete', danger: true
    });
    if (!ok) return;
    for (const id of [...(t.entryImgs || []), ...(t.exitImgs || [])]) await Img.remove(id);
    await Trades.remove(t.id);
    Sheet.close();
    await refresh();
    toast('Trade deleted');
  };
}

/* =================== MANAGE tab =================== */
function renderManage() {
  const listCard = (title, key, items, placeholder, caps) => `
    <div class="card">
      <h3>${title}</h3>
      <div class="chips">
        ${items.length ? items.map(v => `<button class="chip on" data-list="${key}" data-v="${esc(v)}">${esc(v)}<span class="x">✕</span></button>`).join('')
          : `<span class="hint">Nothing here yet.</span>`}
      </div>
      <div class="add-row">
        <input class="input ${caps ? '' : 'nocaps'}" id="add-${key}" placeholder="${placeholder}" autocomplete="off">
        <button class="btn" data-add="${key}">Add</button>
      </div>
    </div>`;
  view.innerHTML = `
    ${listCard('Pairs', 'pairs', State.pairs, 'e.g. XAUUSD', true)}
    ${listCard('Setup tags', 'setups', State.setups, 'e.g. Breakout', false)}
    <p class="hint" style="margin-top:14px">Pairs and setups become quick-pick chips in the trade form. Removing one never touches trades already logged with it.</p>`;

  const save = async key => {
    await Meta.set(key, State[key]);
    renderManage();
  };
  $$('[data-list]').forEach(b => b.onclick = async () => {
    const key = b.dataset.list, v = b.dataset.v;
    State[key] = State[key].filter(x => x !== v);
    await save(key);
    toast(`Removed ${v}`);
  });
  $$('[data-add]').forEach(b => b.onclick = async () => {
    const key = b.dataset.add;
    const inp = $('#add-' + key);
    let v = inp.value.trim();
    if (key === 'pairs') v = v.toUpperCase();
    if (!v) return;
    if (State[key].some(x => x.toLowerCase() === v.toLowerCase())) return toast('Already in the list', 'err');
    State[key].push(v);
    await save(key);
    toast(`Added ${v}`, 'win');
  });
  $$('.add-row .input').forEach(inp => inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') $(`[data-add="${inp.id.slice(4)}"]`).click();
  }));
}

/* =================== BACKUP tab =================== */
const BACKUP_STALE_MS = 7 * 86400e3;
async function backupOverdue() {
  const last = await Meta.get('lastBackup', null);
  return State.trades.length > 0 && (!last || Date.now() - last > BACKUP_STALE_MS);
}

async function renderBackup() {
  const last = await Meta.get('lastBackup', null);
  const overdue = await backupOverdue();
  view.innerHTML = `
    ${DB.usingMemory ? `<div class="card"><p class="hint" style="color:#ffb4b4">Storage is unavailable in this browser session — export a backup before closing this tab.</p></div>` : ''}
    <div class="card">
      <h3>Status</h3>
      <div class="bk-status ${overdue ? 'warn' : ''} num"><span class="led"></span>
        Last backup: ${fmtAgo(last)}${overdue ? ' — time to back up' : ''}</div>
      <p class="bk-desc" style="margin-top:8px">Everything lives only on this device. Export regularly and restore on another device to stay in sync.</p>
    </div>
    <div class="card">
      <h3>Export</h3>
      <p class="bk-desc">Full backup — trades, settings and screenshots in one file. Use this to restore.</p>
      <button class="btn primary block" id="bkJson">Export JSON backup</button>
      <p class="bk-desc" style="margin-top:14px">Browseable copy — a ZIP with your screenshots as image files plus a journal.json.</p>
      <button class="btn block" id="bkZip">Export ZIP archive</button>
    </div>
    <div class="card">
      <h3>Restore</h3>
      <p class="bk-desc">Import a JSON backup. This replaces everything currently on this device.</p>
      <button class="btn block" id="bkImport">Import backup…</button>
      <input type="file" id="bkFile" accept=".json,application/json" hidden>
    </div>
    <div class="card">
      <h3>Danger zone</h3>
      <p class="bk-desc">Wipe every trade, screenshot and setting from this device.</p>
      <button class="btn danger block" id="bkErase">Erase all data</button>
    </div>`;

  const busy = (btn, label, fn) => async () => {
    const old = btn.textContent;
    btn.disabled = true; btn.textContent = label;
    try { await fn(); }
    catch (e) { toast(e.message || 'Something went wrong', 'err'); }
    finally { btn.disabled = false; btn.textContent = old; updateBackupDot(); if (State.tab === 'backup') renderBackup(); }
  };
  const j = $('#bkJson'), z = $('#bkZip');
  j.onclick = busy(j, 'Exporting…', async () => { await Backup.exportJSON(); toast('Backup exported', 'win'); });
  z.onclick = busy(z, 'Building ZIP…', async () => { await Backup.exportZIP(); toast('ZIP exported', 'win'); });

  $('#bkImport').onclick = () => $('#bkFile').click();
  $('#bkFile').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const ok = await confirmDialog({
      title: 'Restore from backup?',
      body: `Everything on this device will be replaced by the contents of “${file.name}”.`,
      okText: 'Restore', danger: true
    });
    if (!ok) return;
    try {
      const n = await Backup.importJSON(file);
      State.pairs  = await Meta.get('pairs', []);
      State.setups = await Meta.get('setups', []);
      await refresh();
      renderBackup();
      toast(`Restored ${n} trade${n === 1 ? '' : 's'}`, 'win');
    } catch (err) { toast(err.message || 'Restore failed', 'err'); }
  });

  $('#bkErase').onclick = async () => {
    const ok = await confirmDialog({
      title: 'Erase everything?',
      body: 'All trades, screenshots and settings will be permanently deleted from this device. There is no undo.',
      okText: 'Erase', danger: true, requireText: 'ERASE'
    });
    if (!ok) return;
    await Backup.eraseAll();
    State.pairs = []; State.setups = [];
    await refresh();
    renderBackup();
    toast('All data erased');
  };
}

/* =================== navigation + boot =================== */
function switchTab(tab) {
  State.tab = tab;
  $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#fab').hidden = tab !== 'trades';
  ({ tier: renderTier, trades: renderTrades, stats: renderStats, manage: renderManage, backup: renderBackup })[tab]();
  view.scrollTop = 0; window.scrollTo(0, 0);
}

function updateTierPill() {
  const cur = Tier.current(State.trades);
  $('#tierPill').textContent = `T${cur} · $${fmtNum(Tier.stake(cur))}`;
}

async function updateBackupDot() {
  const nav = $('#navBackup');
  $('.dot', nav)?.remove();
  if (await backupOverdue()) {
    const d = document.createElement('span');
    d.className = 'dot';
    nav.appendChild(d);
  }
}

async function refresh() {
  State.trades = await Trades.all();
  updateTierPill();
  updateBackupDot();
  switchTab(State.tab);
}

// Wire up all controls first — this must never depend on storage succeeding,
// otherwise a storage failure would leave the whole UI unclickable.
function wireControls() {
  $$('.tabs button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  $('#fab').onclick = () => openTradeForm();
  $('#tierPill').onclick = () => switchTab('tier');

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('#lightbox').hidden) return closeLightbox();
    if (!$('#confirm').hidden) return;
    if (Sheet.isOpen()) Sheet.tryClose();
  });
  window.addEventListener('beforeunload', e => {
    if (State.formDirty) { e.preventDefault(); e.returnValue = ''; }
  });
}

async function loadData() {
  const ok = await DB.open();
  if (!ok) $('#storageWarn').hidden = false;

  let pairs = await Meta.get('pairs', null);
  if (!pairs) { pairs = ['XAUUSD', 'EURUSD', 'GBPUSD', 'USDJPY']; await Meta.set('pairs', pairs); }
  let setups = await Meta.get('setups', null);
  if (!setups) { setups = ['Breakout', 'Pullback', 'Reversal', 'Range']; await Meta.set('setups', setups); }
  State.pairs = pairs;
  State.setups = setups;
  State.trades = await Trades.all();
}

async function boot() {
  // 1) Controls + first paint happen no matter what.
  try { wireControls(); } catch (e) { console.error('wire failed', e); }
  try { switchTab('tier'); } catch (e) { console.error('initial render failed', e); }

  // 2) Load persisted data; on failure, fall back to in-memory defaults so the app still works.
  try {
    await loadData();
  } catch (e) {
    console.error('storage init failed, using session-only mode', e);
    $('#storageWarn').hidden = false;
    if (!State.pairs?.length)  State.pairs  = ['XAUUSD', 'EURUSD', 'GBPUSD', 'USDJPY'];
    if (!State.setups?.length) State.setups = ['Breakout', 'Pullback', 'Reversal', 'Range'];
    State.trades = State.trades || [];
  }

  // 3) Re-render now that data is in, and update chrome.
  updateTierPill();
  updateBackupDot();
  switchTab(State.tab || 'tier');

  try {
    if (await backupOverdue()) {
      setTimeout(() => toast("It's been a while since your last backup — export one from the Backup tab."), 1200);
    }
  } catch (_) {}
}

// Boot once the DOM is parsed. The script sits at end of <body>, but guard anyway
// so wiring runs reliably across browsers/embeds.
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>
